services:
  - type: web
    name: jjab-bul-choom
    runtime: static
    repo: https://github.com/yjchoi101222/Jjab-Bul_Choom
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sample/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
